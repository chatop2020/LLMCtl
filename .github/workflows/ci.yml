name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate shell syntax
        run: bash -n install-llm-cluster.sh llmctl.sh

      - name: Compile Python sources
        run: python -m py_compile lib/model_catalog.py tests/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
